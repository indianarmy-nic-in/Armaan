<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  
  <!-- iPhone Full Screen (Standalone Mode) के लिए विशिष्ट Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Armed Forces">
  
  <!-- स्क्रीन को फिट करने और ज़ूम रोकने के लिए (App Feel) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  
  <!-- होम स्क्रीन आइकॉन -->
  <link rel="apple-touch-icon" href="https://upload.wikimedia.org/wikipedia/commons/thumb/0/00/Flag_of_the_Indian_Armed_Forces.svg/3840px-Flag_of_the_Indian_Armed_Forces.svg.png">

  <title>Official Portal</title>
  <style>
    :root {
      --logo-size: 140px; 
      --primary: #36379e;
      --secondary: #e76060;
      --gold: #FFD700;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      height: 100%; width: 100vw;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      background: #000;
    }

    /* --- 1. प्रीलोडर सेक्शन (अपडेटेड बैकग्राउंड) --- */
    #preloader {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgdI2QxJb5zX481BhDXNyjuMZ-S1qf-jgD_BRAgdLvw-VSoxvggNs4kZHuQuAwBv8W0Xf8cIdZ9Fo6X5V3w8RRrWUdeRHnAsrVabO-yivbORFqdiSkvQPWXemTt-_c2wWrBxM1qfZkWeDZJ84k2pGV5AyDpT72jHarDlTwudlPDp7qJVYljzWK6-SiQBhbn/s1920/Add%20a%20heading.jpeg') no-repeat center center;
      /* नीचे दी गई दो लाइनों से इमेज बिना किसी मार्जिन के पूरी स्क्रीन पर (ऊपर से नीचे तक) फिट हो जाएगी */
      background-size: 100% 100%;
      background-attachment: fixed;
    }

    .preloader-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* लोगो कंटेनर शाइन और शैडो के लिए */
    .logo-wrapper {
      position: relative;
      width: var(--logo-size);
      height: auto;
      display: inline-block;
      overflow: hidden; 
      border-radius: 8px;
      animation: logoGlow 2s ease-in-out infinite alternate;
    }

    .preloader-logo {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0;
      transform: scale(0.5);
      animation: logoZoom 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .logo-wrapper::after {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 50%;
      height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-25deg);
      animation: shine 3s ease-in-out infinite;
      animation-delay: 1.5s; 
    }

    .preloader-text {
      margin-top: 20px;
      font-size: 18px;
      font-weight: 800;
      color: white;
      text-transform: uppercase;
      opacity: 0;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      animation: textSmoothReveal 2s cubic-bezier(0.4, 0, 0.2, 1) 1.2s forwards;
    }

    @keyframes logoZoom {
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes logoGlow {
      0% { box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); }
      100% { box-shadow: 0 0 35px rgba(255, 255, 255, 0.7); }
    }

    @keyframes shine {
      100% { left: 150%; }
    }

    @keyframes textSmoothReveal {
      0% { opacity: 0; letter-spacing: -5px; filter: blur(10px); }
      50% { opacity: 0.5; filter: blur(3px); }
      100% { opacity: 1; letter-spacing: 3px; filter: blur(0); }
    }

    /* --- 2. मुख्य लॉगिन पेज --- */
    #mainContent {
      display: none;
      height: 100%;
      width: 100%;
      background: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgX9ZZbUSTg0UC7EKdAgZx9415RAvZvrX7cF7Q7ngf4RjiCy2bVEVJNKS0Y_ymUAppjfJZWlZtPY6n4e2IToZJqLc_tZR1g0puXfhugOezfjoY02HuFeuac_YlBeF7qq8lRDKsD3CPA-E0yuDbHMDcBJ2nLVIHK3D2WZUdP8mc9teLt_BSe4Dg9HE04DHHx/s1920/Add%20a%20heading.jpeg') no-repeat center center;
      background-size: cover;
      position: relative;
    }

    .login-box {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      width: 350px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      padding: 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      animation: fadeIn 1s ease-out;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      font-size: 13px;
      text-align: center;
      font-weight: 600;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      color: white;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #errorNote {
      color: #ff4d4d;
      font-size: 11px;
      margin-bottom: 10px;
      display: none;
      font-weight: bold;
    }

    .loader-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 11000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid var(--secondary);
      border-radius: 50%;
      width: 45px; height: 45px;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, 15px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .footer-text {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      letter-spacing: 1px;
      font-weight: 800;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- प्रीलोडर सेक्शन -->
  <div id="preloader">
    <div class="preloader-container">
      <div class="logo-wrapper">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/00/Flag_of_the_Indian_Armed_Forces.svg/3840px-Flag_of_the_Indian_Armed_Forces.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail" alt="Logo" class="preloader-logo">
      </div>
      <div class="preloader-text">INDIAN ARMED FORCES</div>
    </div>
  </div>

  <!-- रिडायरेक्ट लोडिंग -->
  <div class="loader-overlay" id="loadingScreen">
    <div class="spinner"></div>
    <p style="font-size: 13px; letter-spacing: 1px;">AUTHENTICATING...</p>
  </div>

  <!-- मेन कंटेंट -->
  <div id="mainContent">
    <div class="login-box">
      <div id="errorNote">NO RECORD FOUND</div>
      <input type="text" id="serviceID" placeholder="ENTER SERVICE ID" autocomplete="off">
      <button class="btn" onclick="checkLogin()">PROCEED</button>
    </div>

    <div class="footer-text">
      OFFICIAL ARMAAN 2.0 <br/> Integrated Headquarters of the MoD (IAF)
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const pre = document.getElementById('preloader');
        pre.style.transition = 'opacity 0.8s ease';
        pre.style.opacity = '0';
        setTimeout(() => {
          pre.style.display = 'none';
          document.getElementById('mainContent').style.display = 'block';
        }, 800);
      }, 5000); 
    });

    function checkLogin() {
      const idInput = document.getElementById('serviceID').value.trim().toUpperCase();
      const error = document.getElementById('errorNote');
      const loader = document.getElementById('loadingScreen');

      if (idInput === "IC80129D") {
        error.style.display = 'none';
        loader.style.display = 'flex';
        
        setTimeout(() => {
          window.location.href = "https://indianarmy-nic-in.github.io/dashboard/";
        }, 4000);
      } else {
        error.style.display = 'block';
        setTimeout(() => {
          error.style.display = 'none';
        }, 2000);
      }
    }
  </script>
</body>
</html>
